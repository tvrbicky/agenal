# Varianta pro nginx: /etc/nginx/sites-available/energie.golferis.cz
# pak: ln -s ../sites-available/energie.golferis.cz /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#      certbot --nginx -d energie.golferis.cz
server {
    listen 80;
    server_name energie.golferis.cz;
    client_max_body_size 20m;   # nahrávání exportů
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
